<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0S1 // Mühendislik Kütüphanesi</title>
    <style>
        /* Göz Yormayan Teknik Tema (True Dark) */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #b3b3b3;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
            line-height: 1.6;
        }

        /* Sol Menü (Sidebar) */
        .sidebar {
            width: 280px;
            background-color: #111111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            white-space: nowrap;
            overflow-x: hidden;
        }

        .sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        .sidebar-content {
            padding: 20px;
            width: 240px; /* İçerik genişliği sabit kalsın ki kapanırken taşmasın */
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .sidebar-header h2 {
            color: #555;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
        }
        
        .close-btn:hover { color: #fff; }

        /* Kategori Açılır/Kapanır (Accordion) */
        .menu-category {
            margin-bottom: 20px;
        }

        .menu-category-title {
            color: #e0e0e0;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
        }
        
        .menu-category-title:hover { color: #fff; }

        .menu-list {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .menu-list li {
            margin-bottom: 8px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .menu-list li:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Ana İçerik Alanı */
        .content {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            background-color: #0a0a0a;
            position: relative;
        }

        .open-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #111;
            border: 1px solid #333;
            color: #888;
            padding: 5px 10px;
            cursor: pointer;
            font-family: monospace;
            display: none;
        }

        .open-btn:hover { background: #222; color: #fff; }

        h1 {
            color: #ffffff;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-weight: normal;
        }

        p {
            font-size: 15px;
            max-width: 900px;
            text-align: justify;
        }

        .tag {
            background-color: #222;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #999;
            border: 1px solid #333;
            margin-right: 5px;
        }
    </style>
</head>
